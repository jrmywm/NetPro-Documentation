network:
  version: 2
  renderer: networkd
  ethernets:
    ens33:
      match:
        macaddress: 00:0c:29:da:93:08
      set-name: ens33
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
      addresses: [192.168.31.38/24]
      routes:
        - to: default
          via: 192.168.31.2
      nameservers:
        addresses: [192.168.31.2]
    ens34:
      match:
        macaddress: 00:0c:29:da:93:12
      set-name: ens34
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
      optional: true
    ens35:
      match:
        macaddress: 00:0c:29:da:93:1c
      set-name: ens35
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
      optional: true
    ens36:
      match:
        macaddress: 00:0c:29:da:93:26
      set-name: ens36
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
      optional: true
  bridges:
    br-tap:
      interfaces: [ens34, ens35]
      dhcp4: false
      dhcp6: false
      accept-ra: false
      link-local: []
      parameters:
        stp: true
        forward-delay: 4
      optional: true
